name: checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile every script
        run: python -m compileall -q python agentforce
      - name: Spec census smoke run (free, no org)
        run: |
          pip install -q pyyaml
          python agentforce/spec_census.py examples/sample-test-spec.yaml
          python agentforce/spec_census.py subject/specs/Harborline_Agent-testSpec.yaml
